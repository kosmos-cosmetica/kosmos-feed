name: Catálogo para ChatGPT

# Todos los días a las 6:00 de Argentina arma el archivo de productos desde
# Tiendanube y lo publica con GitHub Pages en
# https://kosmos-cosmetica.github.io/kosmos-feed/chatgpt_productos.csv
# (link cargado en ChatGPT Business Hub → Productos → «Usar una URL alojada»).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_reintento.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Armar el archivo desde Tiendanube
        env:
          TN_STORE_ID: ${{ secrets.TN_STORE_ID }}
          TN_ACCESS_TOKEN: ${{ secrets.TN_ACCESS_TOKEN }}
          TN_USER_AGENT: ${{ secrets.TN_USER_AGENT }}
        run: python chatgpt_feed.py
      # 26/11/2026: el mismo archivo va al catálogo de la cuenta de ChatGPT Ads
      # (feed fd_87ed1b9d…, Argentina), que es aparte del de Business Hub y sólo
      # se carga por SFTP. Si falla no frena la publicación de la URL.
      - name: Subir el archivo a ChatGPT Ads (SFTP)
        continue-on-error: true
        env:
          SFTP_KEY: ${{ secrets.CHATGPT_SFTP_KEY }}
          SFTP_DESTINO: ${{ secrets.CHATGPT_SFTP_DESTINO }}
        run: |
          umask 077
          printf '%s\n' "$SFTP_KEY" > "$RUNNER_TEMP/sftp_key"
          echo "put publicar_feed/chatgpt_productos.csv catalog.csv" | \
            sftp -b - -P 443 -i "$RUNNER_TEMP/sftp_key" -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=chatgpt_ads_known_hosts -o StrictHostKeyChecking=yes \
              "$SFTP_DESTINO"
          rm -f "$RUNNER_TEMP/sftp_key"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: publicar_feed
      # 23/11/2026: dos veces en ocho días (20/11 y 23/11) deploy-pages no
      # encontró el archivo recién subido ("No artifacts named github-pages"):
      # la API de GitHub tarda unos segundos en verlo. Se le da tiempo y, si
      # igual falla, se reintenta una vez un minuto después.
      - name: Esperar a que GitHub registre el archivo
        run: sleep 15
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Esperar antes de reintentar
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_reintento
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verificar que quedó público
        run: |
          sleep 30
          code=$(curl -s -o /dev/null -w "%{http_code}" https://kosmos-cosmetica.github.io/kosmos-feed/chatgpt_productos.csv)
          echo "HTTP $code"
          test "$code" = "200"
