name: Catálogo para ChatGPT

# Todos los días a las 6:00 de Argentina arma el archivo de productos desde
# Tiendanube y lo publica en https://kosmos-feed.pages.dev/chatgpt_productos.csv
# (link cargado en ChatGPT Business Hub → Productos → «Usar una URL alojada»).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Armar el archivo desde Tiendanube
        env:
          TN_STORE_ID: ${{ secrets.TN_STORE_ID }}
          TN_ACCESS_TOKEN: ${{ secrets.TN_ACCESS_TOKEN }}
          TN_USER_AGENT: ${{ secrets.TN_USER_AGENT }}
        run: python chatgpt_feed.py
      - name: Publicar en kosmos-feed.pages.dev
        working-directory: publicar_feed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy . --project-name=kosmos-feed --branch=main --commit-dirty=true
      - name: Verificar que quedó público
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w "%{http_code}" https://kosmos-feed.pages.dev/chatgpt_productos.csv)
          echo "HTTP $code"
          test "$code" = "200"
